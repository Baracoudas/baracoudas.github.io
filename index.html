<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baracoudas</title>
<meta name="description" content="Projets de Baracoudas">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #0b0d12;
    --surface: #14171f;
    --border: #262b36;
    --text: #e8eaef;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 3rem;
  }
  header {
    margin-bottom: 3rem;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.4rem;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 1.05rem;
  }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 1rem;
  }
  .projects {
    display: grid;
    gap: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .card-head h3 {
    margin: 0;
    font-size: 1.1rem;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    background: rgba(91, 140, 255, 0.15);
    color: var(--accent);
    white-space: nowrap;
  }
  .card p {
    margin: 0.5rem 0 0;
    color: var(--text-dim);
    font-size: 0.95rem;
  }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  footer a {
    color: var(--text-dim);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  footer a:hover {
    color: var(--text);
  }
  #gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #gate form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 280px;
    padding: 0 1.5rem;
  }
  #gate input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.6rem 0.75rem;
    font-size: 1rem;
  }
  #gate input:focus {
    outline: 1px solid var(--accent);
  }
  #gate button {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    padding: 0.6rem 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #gate p {
    margin: 0;
    color: #ff6b6b;
    font-size: 0.85rem;
    min-height: 1.2em;
  }
  main { display: none; }
</style>
</head>
<body>
<div id="gate">
  <form id="gate-form" autocomplete="off">
    <input type="password" id="gate-input" placeholder="Mot de passe" autofocus>
    <button type="submit">Entrer</button>
    <p id="gate-error"></p>
  </form>
</div>
<main>
  <header>
    <h1>Baracoudas</h1>
    <p>Projets en cours et à venir.</p>
  </header>

  <section>
    <h2>Projets</h2>
    <div class="projects">
      <div class="card">
        <div class="card-head">
          <h3>Voyage</h3>
          <span class="badge">En développement</span>
        </div>
        <p>Organisation de voyages en famille : planification d'étapes, activités et cartes, pilotée depuis Discord.</p>
      </div>
    </div>
  </section>

  <footer>
    <a href="https://github.com/Baracoudas">github.com/Baracoudas</a>
  </footer>
</main>
<script>
(function () {
  var HASH = "d90fa9334651aeaa6b6819f35799d00510b72e387e8d0be17e13509a440ee2a8";
  var STORAGE_KEY = "site-unlocked";

  function sha256(text) {
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", data).then(function (buf) {
      return Array.from(new Uint8Array(buf))
        .map(function (b) { return b.toString(16).padStart(2, "0"); })
        .join("");
    });
  }

  function unlock() {
    document.getElementById("gate").remove();
    document.querySelector("main").style.display = "";
  }

  if (localStorage.getItem(STORAGE_KEY) === "1") {
    unlock();
    return;
  }

  document.getElementById("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("gate-input").value;
    sha256(input).then(function (hash) {
      if (hash === HASH) {
        localStorage.setItem(STORAGE_KEY, "1");
        unlock();
      } else {
        document.getElementById("gate-error").textContent = "Mot de passe incorrect.";
        document.getElementById("gate-input").value = "";
      }
    });
  });
})();
</script>
</body>
</html>
