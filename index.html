<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baracoudas</title>
<meta name="description" content="Projets de Baracoudas">
<style>
  :root {
    --bg: #0b0d12;
    --surface: #14171f;
    --border: #262b36;
    --text: #e8eaef;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 3rem;
  }
  header {
    margin-bottom: 3rem;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.4rem;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 1.05rem;
  }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 1rem;
  }
  .projects {
    display: grid;
    gap: 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .card-head h3 {
    margin: 0;
    font-size: 1.1rem;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    background: rgba(91, 140, 255, 0.15);
    color: var(--accent);
    white-space: nowrap;
  }
  .card p {
    margin: 0.5rem 0 0;
    color: var(--text-dim);
    font-size: 0.95rem;
  }
  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  footer a {
    color: var(--text-dim);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  footer a:hover {
    color: var(--text);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Baracoudas</h1>
    <p>Projets en cours et à venir.</p>
  </header>

  <section>
    <h2>Projets</h2>
    <div class="projects">
      <div class="card">
        <div class="card-head">
          <h3>Voyage</h3>
          <span class="badge">En développement</span>
        </div>
        <p>Organisation de voyages en famille : planification d'étapes, activités et cartes, pilotée depuis Discord.</p>
      </div>
    </div>
  </section>

  <footer>
    <a href="https://github.com/Baracoudas">github.com/Baracoudas</a>
  </footer>
</main>
</body>
</html>
